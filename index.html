<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Robbie’s Games</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}

body{
  background:radial-gradient(ellipse at bottom,#1b2040 0%,#090a14 70%);
  color:#e8ecff;
  font-family:"Trebuchet MS",Arial,sans-serif;
  min-height:100vh;
  overflow-x:hidden
}

#stars{position:fixed;inset:0;z-index:0;pointer-events:none}

.planet{
  position:fixed;
  border-radius:50%;
  z-index:0;
  opacity:.55;
  filter:blur(1px);
  animation:float 14s ease-in-out infinite
}

.p1{
  width:180px;height:180px;top:8%;right:6%;
  background:radial-gradient(circle at 30% 30%,#ffb36b,#c0451f 60%,#5a1a0c)
}

.p2{
  width:110px;height:110px;bottom:10%;left:4%;
  background:radial-gradient(circle at 30% 30%,#8ee3ff,#2a6fd6 60%,#0d2457);
  animation-delay:-5s
}

@keyframes float{50%{transform:translateY(-25px)}}

header{
  position:relative;
  z-index:1;
  text-align:center;
  padding:50px 16px 20px
}

h1{
  font-size:clamp(2.2rem,6vw,4rem);
  letter-spacing:4px;
  background:linear-gradient(90deg,#7df9ff,#b388ff,#ff7de9);
  -webkit-background-clip:text;
  background-clip:text;
  color:transparent
}

header p{margin-top:8px;color:#9aa5d8}

.search{
  position:relative;
  z-index:1;
  display:flex;
  justify-content:center;
  margin:20px 16px
}

.search input{
  width:min(520px,100%);
  padding:14px 22px;
  border-radius:50px;
  border:1px solid #5b6bd6;
  background:rgba(15,18,45,.8);
  color:#fff;
  font-size:1rem;
  outline:none
}

#count{
  position:relative;
  z-index:1;
  text-align:center;
  color:#7df9ff;
  margin-bottom:10px
}

#grid{
  position:relative;
  z-index:1;
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(180px,1fr));
  gap:18px;
  max-width:1100px;
  margin:0 auto;
  padding:15px 20px 60px
}

.card{
  display:block;
  width:100%;
  font:inherit;
  cursor:pointer;
  text-decoration:none;
  color:#e8ecff;
  padding:14px 12px 20px;
  text-align:center;
  border-radius:16px;
  background:linear-gradient(145deg,rgba(40,46,100,.75),rgba(15,18,45,.85));
  border:1px solid rgba(125,140,255,.3);
  transition:.25s;
  font-weight:bold
}

.card:hover{
  transform:translateY(-6px) scale(1.04);
  border-color:#7df9ff;
  box-shadow:0 0 22px rgba(125,249,255,.55)
}

.card img{
  display:block;
  width:100%;
  height:135px;
  object-fit:contain;
  border-radius:10px;
  margin-bottom:12px
}

.card span{
  display:block;
  font-size:2.5rem;
  margin-bottom:12px
}

.card small{
  display:block;
  font-weight:normal;
  font-size:.8rem;
  color:#8f9bd8;
  margin-top:8px
}
</style>
</head>

<body>

<canvas id="stars"></canvas>
<div class="planet p1"></div>
<div class="planet p2"></div>

<header>
  <h1>🚀 ROBBIE’S GAMES</h1>
  <p>Pick a game. Start playing.</p>
</header>

<div class="search">
  <input id="q" type="text" placeholder="Search my games...">
</div>

<div id="count"></div>
<div id="grid"></div>

<script>

const games=[

{
  n:"Paper.io",
  e:"📄",
  u:"https://advanced95.github.io/page/g/paperio2/",
  img:"IMG_9373.png"
},

{
  n:"Minecraft",
  e:"⛏️",
  u:"https://advanced95.github.io/page/g/mc/",
  img:"https://www.google.com/s2/favicons?domain=minecraft.net&sz=128"
},

{
  n:"Adventure Capitalist",
  e:"💰",
  u:"https://advanced95.github.io/page/g/adventurecapitalist/",
  img:"IMG_9372.jpeg"
},

{
  n:"Subway Surfers",
  e:"🏃",
  u:"https://advanced95.github.io/page/g/subway-surfers/",
  img:"IMG_9374.png"
},

{
  n:"Cookie Clicker",
  e:"🍪",
  u:"https://advanced95.github.io/page/g/cookieclicker/",
  img:"IMG_9375.png"
},

{
  n:"Geometry Dash",
  e:"🟩",
  u:"https://advanced95.github.io/page/g/geodash/",
  img:"https://www.google.com/s2/favicons?domain=robtopgames.com&sz=128"
},

{
  n:"Hole.io",
  e:"🕳️",
  u:"https://advanced95.github.io/page/g/holeio/",
  img:"IMG_9376.jpeg"
},

{
  n:"FNAF 1",
  e:"🐻",
  u:"https://advanced95.github.io/page/g/fnaf/",
  img:"https://www.google.com/s2/favicons?domain=scottgames.com&sz=128"
},

{
  n:"FNAF 2",
  e:"🐰",
  u:"https://advanced95.github.io/page/g/fnaf-2/",
  img:"https://www.google.com/s2/favicons?domain=scottgames.com&sz=128"
},

{
  n:"Block Blast",
  e:"🧩",
  u:"https://advanced95.github.io/page/g/blockblast/",
  img:"https://www.google.com/s2/favicons?domain=blockblast.com&sz=128"
}

];

/* DISPLAY GAMES */

const grid=document.getElementById("grid");
const count=document.getElementById("count");
const q=document.getElementById("q");

function render(){

  const term=q.value.toLowerCase();

  const list=games.filter(g=>
    g.n.toLowerCase().includes(term)
  );

  grid.innerHTML="";

  list.forEach(g=>{

    const a=document.createElement("a");

    a.className="card";
    a.href=g.u;
    a.target="_blank";
    a.rel="noopener noreferrer";

    const img=document.createElement("img");

    img.src=g.img;
    img.alt=g.n;
    img.loading="lazy";

    const fallback=document.createElement("span");
    fallback.textContent=g.e;
    fallback.style.display="none";

    img.onerror=()=>{
      img.style.display="none";
      fallback.style.display="block";
    };

    a.appendChild(img);
    a.appendChild(fallback);
    a.appendChild(document.createTextNode(g.n));

    const small=document.createElement("small");
    small.textContent="Play now";

    a.appendChild(small);
    grid.appendChild(a);

  });

  count.textContent=list.length+" games available";

}

q.addEventListener("input",render);
render();

/* STARFIELD */

const sc=document.getElementById("stars");
const sx=sc.getContext("2d");

let st=[];

function size(){

  sc.width=innerWidth;
  sc.height=innerHeight;

  st=Array.from({length:220},()=>({
    x:Math.random()*sc.width,
    y:Math.random()*sc.height,
    r:Math.random()*1.6+.3,
    s:Math.random()*.4+.05,
    t:Math.random()*6
  }));

}

function draw(){

  sx.clearRect(0,0,sc.width,sc.height);

  st.forEach(s=>{

    s.t+=.03;
    s.y+=s.s;

    if(s.y>sc.height){
      s.y=0;
      s.x=Math.random()*sc.width;
    }

    sx.globalAlpha=.5+.5*Math.sin(s.t);
    sx.fillStyle="#fff";
    sx.beginPath();
    sx.arc(s.x,s.y,s.r,0,6.3);
    sx.fill();

  });

  requestAnimationFrame(draw);

}

addEventListener("resize",size);
size();
draw();

</script>
</body>
</html>
